<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>ns-frame · compatibilidad sin Popover API</title>
<script src="./compat-nopop.js"></script>
<script type="module" src="./compat.js"></script>
</head>
<body>
  <button id="t" popovertarget="p">Info</button>
  <div popover id="p" data-ns-arrow="all round 8">Popover sin API nativa</div>
  <button id="tip" data-ns-tip="tt">?</button>
  <div popover="manual" id="tt" role="tooltip" data-ns-arrow>Tooltip</div>
</body>
</html>
